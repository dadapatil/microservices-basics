apiVersion: apps/v1
kind: Deployment
metadata:
  name: department-service-app
  labels:
    app: department-service-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: department-service-app
  template:
    metadata:
      labels:
        app: department-service-app
    spec:
      containers:
        - name: department-service-app
          image: dadyapatil/department-service:0.0.1
          imagePullPolicy: Always
          ports:
            - containerPort: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: department-service-svc
  labels:
    app: department-service-app
spec:
  type: ClusterIP   # Use LoadBalancer if you want external access
  selector:
    app: department-service-app
  ports:
    - port: 80        # Service port
      targetPort: 9000 # Container port  