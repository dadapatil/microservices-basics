apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server-app
  labels:
    app: config-server-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server-app
  template:
    metadata:
      labels:
        app: config-server-app
    spec:
      containers:
        - name: config-server-app
          image: dadyapatil/config-server:0.0.1
          imagePullPolicy: Always
          ports:
            - containerPort: 8088
---
apiVersion: v1
kind: Service
metadata:
  name: config-server-svc
  labels:
    app: config-server-app
spec:
  type: ClusterIP   # Use LoadBalancer if you want external access
  selector:
    app: config-server-app
  ports:
    - port: 80        # Service port
      targetPort: 8088 # Container port  