eureka:
  instance:
    hostname: eureka-0
    prefer-ip-address: true
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://eureka-0.eureka.default.svc.cluster.local:8769/eureka
spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        bootstrap: true

server:
  port: 8088